<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hasnain Heryani — Season 01</title>
  <meta name="description" content="Engineering design portfolio of Hasnain Heryani, UofT Engineering Science — Season 01." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/transitions.css" />

  <style>
    /* ── Homepage-specific styles ──────────────────────────── */

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* locked until visor closes */
    }

    /* Layer stack */
    #scene-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Layer 1 — rain background */
    #rain-bg {
      position: absolute;
      inset: 0;
      background-image: url('./assets/images/rain-bg.jpg');
      background-size: cover;
      background-position: center 40%;
      filter: brightness(0.35) saturate(0.8);
      transform-origin: center center;
      will-change: transform, filter;
      z-index: 1;
    }

    /* Layer 2 — cockpit overlay behind the visor glass */
    #cockpit-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      filter: brightness(0.9) contrast(1.04) saturate(0.92);
    }

    /* Layer 3 — visor panel (slides down from top) */
    /* Initial position set by GSAP (y: '-100%') to avoid CSS/GSAP conflict */
    #visor {
      position: absolute;
      inset: 0;
      background: rgba(13, 14, 16, 0.72);
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      /* transform managed entirely by GSAP */
      will-change: transform;
      z-index: 3;
      overflow: hidden;
      /* Hide offscreen before GSAP initializes — set via inline style in HTML */
    }

    /* Visor: subtle cool blue tint */
    #visor::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 22%),
        rgba(168, 196, 212, 0.08);
      pointer-events: none;
      z-index: 1;
    }

    /* Visor: static top-right glare ellipse */
    #visor::after {
      content: '';
      position: absolute;
      top: -5%;
      right: -5%;
      width: 40%;
      height: 35%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* Visor glare sweep */
    #visor-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255, 255, 255, 0.15) 50%,
        transparent 80%
      );
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Rain canvas on visor */
    #rain-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
    }

    /* ── Scene 1: name + prompt ───────────────────────────── */
    #scene-1-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
      text-align: center;
    }

    #hero-name {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      color: #e8eaf0;
      letter-spacing: 0.06em;
      opacity: 0;
      text-transform: uppercase;
    }

    #hero-subtitle {
      font-family: var(--font-hud);
      font-size: var(--text-sm);
      font-weight: 400;
      color: var(--color-text-muted);
      letter-spacing: 0.18em;
      margin-top: var(--space-3);
      opacity: 0;
    }

    #scroll-prompt {
      position: absolute;
      bottom: var(--space-12);
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-hud);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--color-text-muted);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Sound toggle — only interactive element in Scene 1 */
    #sound-toggle-hero {
      position: fixed;
      top: var(--space-6);
      right: var(--space-6);
      z-index: 10;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--color-border-muted);
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--color-text-muted);
      font-size: var(--text-base);
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }

    #sound-toggle-hero:hover {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    #sound-toggle-hero[aria-pressed="true"] {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    /* ── HUD panels grid ──────────────────────────────────── */
    #hud-grid {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none; /* enabled after visor close */
    }

    #hud-inner {
      width: 100%;
      max-width: 900px;
      padding-inline: var(--space-8);
    }

    /* Crosshair divider lines */
    .hud-crosshair {
      position: absolute;
      background: var(--color-border-muted);
      pointer-events: none;
    }

    .hud-crosshair-h {
      width: 100%;
      height: 1px;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .hud-crosshair-v {
      width: 1px;
      height: 100%;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    #hud-panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: var(--space-3);
      position: relative;
    }

    /* HUD panel */
    .hud-panel {
      position: relative;
      background: var(--color-surface);
      border: 1px solid var(--color-border-muted);
      padding: var(--space-8);
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      cursor: pointer;
      opacity: 0;
      transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
      text-decoration: none;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .hud-panel:hover {
      background: var(--color-surface-raised);
      border-color: var(--color-accent);
      box-shadow: var(--shadow-teal-md);
    }

    /* Corner bracket accents */
    .hud-panel::before,
    .hud-panel::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }

    .hud-panel::before {
      top: 8px;
      left: 8px;
      border-top: 2px solid var(--color-accent);
      border-left: 2px solid var(--color-accent);
    }

    .hud-panel::after {
      bottom: 8px;
      right: 8px;
      border-bottom: 2px solid var(--color-accent);
      border-right: 2px solid var(--color-accent);
    }

    /* Additional corner accents (top-right, bottom-left) via child element */
    .panel-corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .panel-corners::before {
      content: '';
      position: absolute;
      top: 8px;
      right: 8px;
      width: 12px;
      height: 12px;
      border-top: 2px solid var(--color-accent);
      border-right: 2px solid var(--color-accent);
    }

    .panel-corners::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 12px;
      height: 12px;
      border-bottom: 2px solid var(--color-accent);
      border-left: 2px solid var(--color-accent);
    }

    .panel-label {
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: var(--text-xl);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent);
      display: block;
    }

    .panel-sublabel {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      display: block;
      margin-top: var(--space-1);
    }

    /* Panel: teal border active glow (after visor closes) */
    .hud-panel.glow-active {
      box-shadow: var(--shadow-teal-sm);
      border-color: rgba(0, 210, 190, 0.6);
    }

    /* ── Post-visor: body can scroll inner pages ──────────── */
    body.visor-closed {
      overflow: hidden; /* cockpit stays locked */
    }
  </style>
</head>
<body>

  <!-- Page transition overlay (used by transitions.js) -->
  <div id="page-transition-overlay" aria-hidden="true"></div>

  <!-- Sound toggle (Scene 1 — only visible interactive element) -->
  <button
    id="sound-toggle-hero"
    aria-label="Toggle sound off"
    aria-pressed="false"
    title="Sound is off — click to enable"
  >🔇</button>

  <!-- Scene root — all layers stacked here -->
  <div id="scene-root" role="presentation">

    <!-- Layer 1: Rain background -->
    <div id="rain-bg" role="img" aria-label="Mercedes W04 F1 car in wet conditions"></div>

     <!-- Layer 2: Cockpit overlay -->
    <img
      id="cockpit-overlay"
      src="./assets/images/cockpit.png"
      alt=""
      aria-hidden="true"
      width="1920"
      height="1080"
      loading="eager"
    />

    <!-- Layer 3: Visor panel — inline transform keeps it offscreen before GSAP loads -->
    <div id="visor" aria-hidden="true" style="transform: translateY(-100%)">
      <div id="visor-glare"></div>
      <canvas id="rain-canvas" aria-hidden="true"></canvas>
    </div>

    <!-- Scene 1: Name + subtitle (above visor) -->
    <div id="scene-1-content" aria-hidden="false">
      <h1 id="hero-name">Hasnain Heryani</h1>
      <p id="hero-subtitle">Engineering Science &middot; Season 01</p>
    </div>

    <!-- Scroll prompt -->
    <p id="scroll-prompt" aria-hidden="true">&#8595;&nbsp;&nbsp;Scroll to Begin</p>

    <!-- HUD grid (inside visor layer) -->
    <div id="hud-grid" aria-label="Navigation menu" role="navigation">
      <div id="hud-inner">
        <div id="hud-panels">
          <!-- Top-left: SYSTEMS -->
          <a
            href="./systems.html"
            class="hud-panel"
            data-direction="forward"
            aria-label="Systems — Projects"
          >
            <div class="panel-corners" aria-hidden="true"></div>
            <span class="panel-label">Systems</span>
            <span class="panel-sublabel">Projects</span>
          </a>

          <!-- Top-right: DRIVER -->
          <a
            href="./driver.html"
            class="hud-panel"
            data-direction="left"
            aria-label="Driver — About Me"
          >
            <div class="panel-corners" aria-hidden="true"></div>
            <span class="panel-label">Driver</span>
            <span class="panel-sublabel">About Me</span>
          </a>

          <!-- Bottom-left: DRIVER DNA -->
          <a
            href="./driver-dna.html"
            class="hud-panel"
            data-direction="down"
            aria-label="Driver DNA — Position Statement"
          >
            <div class="panel-corners" aria-hidden="true"></div>
            <span class="panel-label">Driver DNA</span>
            <span class="panel-sublabel">Position Statement</span>
          </a>

          <!-- Bottom-right: LOGBOOK -->
          <a
            href="./logbook.html"
            class="hud-panel"
            data-direction="right"
            aria-label="Logbook — CTMFs"
          >
            <div class="panel-corners" aria-hidden="true"></div>
            <span class="panel-label">Logbook</span>
            <span class="panel-sublabel">CTMFs</span>
          </a>
        </div>
      </div>
    </div>

  </div><!-- /scene-root -->

  <!-- GSAP via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Howler.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

  <!-- JS modules -->
  <script src="./assets/js/audio.js"></script>
  <script src="./assets/js/visor.js"></script>
  <script src="./assets/js/hud.js"></script>
  <script src="./assets/js/transitions.js"></script>

</body>
</html>
